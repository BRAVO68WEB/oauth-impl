<!DOCTYPE html>
<html>
<head>
    <title>Authorize - OAuth Server</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; }
        .scope-list { background: #f5f5f5; padding: 16px; border-radius: 4px; margin-bottom: 20px; }
        .scope-item { margin-bottom: 8px; }
        .buttons { display: flex; gap: 12px; }
        .btn-approve { flex: 1; padding: 10px; background: #0066ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-approve:hover { background: #0052cc; }
        .btn-deny { flex: 1; padding: 10px; background: #ccc; color: #333; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-deny:hover { background: #bbb; }
        .info { color: #666; margin-bottom: 16px; }
    </style>
</head>
<body>
    <h1>Authorize Access</h1>
    <p class="info"><strong>{{.ClientID}}</strong> is requesting access to your account.</p>
    <p class="info">Signed in as: <strong>{{.Username}}</strong></p>

    <div class="scope-list">
        <h3>Requested Permissions:</h3>
        {{range .Scopes}}
        <div class="scope-item">&#10003; {{.}}</div>
        {{end}}
    </div>

    <form method="POST" action="/consent">
        <input type="hidden" name="client_id" value="{{.ClientID}}">
        <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
        <input type="hidden" name="response_type" value="{{.ResponseType}}">
        <input type="hidden" name="scope" value="{{.Scope}}">
        <input type="hidden" name="state" value="{{.State}}">
        <input type="hidden" name="nonce" value="{{.Nonce}}">
        <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
        <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
        <div class="buttons">
            <button type="submit" name="action" value="approve" class="btn-approve">Approve</button>
            <button type="submit" name="action" value="deny" class="btn-deny">Deny</button>
        </div>
    </form>
</body>
</html>
