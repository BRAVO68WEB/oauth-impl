<!DOCTYPE html>
<html>
<head>
    <title>Two-Factor Authentication - OAuth Server</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 24px; text-align: center; letter-spacing: 8px; }
        button { width: 100%; padding: 10px; background: #0066ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0052cc; }
        .error { color: red; margin-bottom: 12px; }
        .info { color: #666; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Two-Factor Authentication</h1>
    <p class="info">Enter the 6-digit code from your authenticator app.</p>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/login/mfa">
        <input type="hidden" name="client_id" value="{{.ClientID}}">
        <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
        <input type="hidden" name="response_type" value="{{.ResponseType}}">
        <input type="hidden" name="scope" value="{{.Scope}}">
        <input type="hidden" name="state" value="{{.State}}">
        <input type="hidden" name="nonce" value="{{.Nonce}}">
        <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
        <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
        <div class="form-group">
            <label for="code">Verification Code</label>
            <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code">
        </div>
        <button type="submit">Verify</button>
    </form>
</body>
</html>
