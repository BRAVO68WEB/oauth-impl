<!DOCTYPE html>
<html>
<head>
    <title>Setup Two-Factor Authentication - OAuth Server</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; }
        .qr-code { text-align: center; margin: 20px 0; }
        .qr-code img { border: 1px solid #ccc; border-radius: 4px; }
        .secret-box { background: #f5f5f5; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 16px; word-break: break-all; margin: 16px 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 24px; text-align: center; letter-spacing: 8px; }
        button { width: 100%; padding: 10px; background: #0066ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0052cc; }
        .error { color: red; margin-bottom: 12px; }
        .info { color: #666; margin-bottom: 16px; font-size: 14px; }
        .toggle-secret { color: #0066ff; cursor: pointer; font-size: 14px; margin-top: 8px; display: inline-block; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Setup Two-Factor Authentication</h1>
    <p class="info">Scan this QR code with your authenticator app (Google Authenticator, Authy, etc.)</p>

    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}

    <div class="qr-code">
        <img src="data:image/png;base64,{{.QRCodeBase64}}" alt="QR Code" width="256" height="256">
    </div>

    <div>
        <span class="toggle-secret" onclick="document.getElementById('secret-section').classList.toggle('hidden')">
            Can't scan? Show secret key
        </span>
        <div id="secret-section" class="hidden">
            <div class="secret-box">{{.Secret}}</div>
            <p class="info">Issuer: {{.Issuer}}<br>Account: {{.Username}}</p>
        </div>
    </div>

    <form method="POST" action="/mfa/enroll/verify">
        <input type="hidden" name="client_id" value="{{.ClientID}}">
        <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
        <input type="hidden" name="response_type" value="{{.ResponseType}}">
        <input type="hidden" name="scope" value="{{.Scope}}">
        <input type="hidden" name="state" value="{{.State}}">
        <input type="hidden" name="nonce" value="{{.Nonce}}">
        <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
        <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
        <input type="hidden" name="request_uri" value="{{.RequestURI}}">
        <input type="hidden" name="prompt" value="{{.Prompt}}">
        <input type="hidden" name="login_hint" value="{{.LoginHint}}">
        <input type="hidden" name="resource" value="{{.Resource}}">
        <input type="hidden" name="secret" value="{{.Secret}}">
        <div class="form-group">
            <label for="code">Enter verification code to confirm</label>
            <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code">
        </div>
        <button type="submit">Verify & Enable</button>
    </form>
</body>
</html>
