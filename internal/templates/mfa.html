{{template "head" .}}
{{template "brand_header" .}}
    <p class="lede">Enter the 6-digit code from your authenticator app.</p>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/login/mfa">
        {{template "oauth_fields" .}}
        <div class="form-group">
            <label for="code">Verification code</label>
            <input type="text" class="code" id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus autocomplete="one-time-code">
        </div>
        <button type="submit">Verify</button>
    </form>
{{template "card_close" .}}
{{template "brand_footer" .}}
