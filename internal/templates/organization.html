{{template "head" .}}
{{template "brand_header" .}}
    <p class="lede">Signed in as <strong>{{.Username}}</strong>. Choose the organization for this sign-in.</p>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/organization">
        {{template "oauth_fields" .}}
        <div class="org-list">
            {{range .Orgs}}
            <label class="org-choice">
                <input type="radio" name="organization" value="{{.Slug}}" required>
                <span><strong>{{.Name}}</strong><span>{{.Slug}}</span></span>
            </label>
            {{end}}
        </div>
        <button type="submit">Continue</button>
    </form>
{{template "card_close" .}}
{{template "brand_footer" .}}
